<mat-form-field>
  <mat-label>{{ field.label }}</mat-label>
  <mat-select [formControl]="form">
    @for (option of options; track option.value) {
      @if (option.label.length === 0) {
        <mat-divider></mat-divider>
      } @else {
        <mat-option [value]="option.value">{{ option.label }}</mat-option>
      }
    }
  </mat-select>
</mat-form-field>
