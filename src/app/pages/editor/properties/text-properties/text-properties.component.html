<form>
  <fig-string-field [field]="getField('text')"
                    [textarea]="this.widget.isWrapped"
                    (update)="updateWidget()" />

  <fig-string-field [field]="getField('tooltip')" />

  <fig-color-field [field]="getField('color')" />

  <fig-bool-field [field]="getField('isDisabled')" />

  <fig-bool-field [field]="getField('isWrapped')" />

  <fig-bool-field [field]="getField('hasBullet')" />

  <fig-bool-field [field]="getField('align')" />
</form>
