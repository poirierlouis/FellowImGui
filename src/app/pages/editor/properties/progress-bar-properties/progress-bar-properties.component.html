<form>
  <fig-string-field [field]="getField('label')"
                    (update)="updateWidget()"></fig-string-field>

  <fig-string-field [field]="getField('tooltip')"></fig-string-field>

  <fig-integer-field [field]="getField('value')"
                     type="percentage"
                     min="0"
                     max="100"
                     step="1"></fig-integer-field>

  <fig-bool-field [field]="getField('isFill')"></fig-bool-field>
</form>
