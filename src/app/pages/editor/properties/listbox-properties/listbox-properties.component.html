<form>
  <fig-string-field [field]="getField('label')"
                    (update)="updateWidget()"/>

  <fig-string-field [field]="getField('tooltip')"/>

  <fig-array-string-field [field]="getField('items')"/>

  <fig-integer-field [field]="getField('itemsSize')"
                     min="1"/>

  <fig-integer-field [field]="getField('selectedItem')"
                     min="0"
                     [max]="maxItems"/>
</form>
