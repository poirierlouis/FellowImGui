<form>
  <fig-string-field [field]="getField('label')"
                    (update)="updateWidget()"></fig-string-field>

  <fig-flags-field [field]="getField('flags')"></fig-flags-field>

  <div class="mat-form-field">
    <mat-label>Show debug button</mat-label>
    <mat-slide-toggle color="primary"
                      [formControl]="debug"></mat-slide-toggle>
  </div>
</form>
