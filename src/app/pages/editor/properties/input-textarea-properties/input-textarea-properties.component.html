<form>
  <fig-string-field prefix="##"
                    [field]="getField('label')"
                    (update)="updateWidget()"/>

  <fig-string-field [field]="getField('tooltip')"/>

  <fig-string-field [field]="getField('value')"
                    debounce="300"
                    textarea/>

  <fig-integer-field [field]="getField('linesSize')"
                     min="1"/>

  <fig-integer-field [field]="getField('bufferSize')"
                     debounce="300"
                     min="1"/>

  <fig-flags-field [field]="getField('flags')"/>
</form>
